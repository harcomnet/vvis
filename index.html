
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VVIS - Scan Kendaraan</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;padding:16px;
  font-family:Arial,sans-serif;
  background:#f1f4f8;color:#263445
}
.container{
  max-width:480px;margin:15px auto;
  background:white;padding:22px 18px;
  border-radius:18px;min-height:90vh;
  box-shadow:0 4px 18px #00000012
}
h1{text-align:center;color:#174f86;font-size:28px}
h2{text-align:center;color:#174f86}
p{font-size:16px;line-height:1.5;color:#667085}
button{
  width:100%;padding:18px;margin-top:15px;
  border:0;border-radius:12px;
  background:#1769aa;color:white;
  font-size:19px;font-weight:bold
}
button:disabled{opacity:.5}
.green{background:#16834a}
.gray{background:#667085}
.camera{
  width:100%;min-height:240px;
  background:#17212f;border-radius:12px;
  overflow:hidden;position:relative;
  display:flex;align-items:center;
  justify-content:center;margin-top:18px
}
video,img{width:100%;max-height:420px;object-fit:contain}
video{display:none}
#photo{display:none}
.guide{
  position:absolute;width:88%;height:32%;
  border:3px solid #35d07f;border-radius:8px;
  pointer-events:none
}
label{
  display:block;font-weight:bold;
  font-size:17px;margin-top:22px
}
input{
  width:100%;padding:17px;
  border:2px solid #ccd4df;
  border-radius:10px;font-size:22px;
  margin-top:8px;text-transform:uppercase
}
.status{
  margin-top:15px;padding:14px;
  border-radius:9px;background:#eef3f8;
  line-height:1.5;font-size:15px
}
.footer{text-align:center;margin-top:30px;font-size:12px;color:#98a2b3}
</style>
</head>

<body>
<div class="container">

<h1>🚗 VVIS</h1>
<h2>SCAN KENDARAAN</h2>

<p style="text-align:center">
Arahkan kamera ke nomor polisi mobil.
Pastikan tulisan terlihat jelas.
</p>

<div class="camera">
  <div id="placeholder" style="color:white;text-align:center;padding:20px">
    📷<br><br>KAMERA BELUM AKTIF
  </div>
  <video id="camera" autoplay playsinline muted></video>
  <img id="photo" alt="Foto kendaraan">
  <div class="guide" id="guide" style="display:none"></div>
</div>

<canvas id="canvas" style="display:none"></canvas>

<button id="startBtn" onclick="startCamera()">MULAI KAMERA</button>
<button id="captureBtn" class="green" style="display:none" onclick="capturePhoto()">AMBIL FOTO</button>
<button id="retakeBtn" class="gray" style="display:none" onclick="retakePhoto()">FOTO ULANG</button>

<div class="status" id="status">
Kamera belum diaktifkan.
</div>

<button id="ocrBtn" class="green" style="display:none" onclick="readPlate()">
BACA NOMOR POLISI
</button>

<label>HASIL NOMOR POLISI</label>
<input id="plate" placeholder="Contoh: B 1828 HOR">

<p>Periksa dan koreksi nomor polisi jika hasil pembacaan belum tepat.</p>

<button id="sendBtn" onclick="sendToVVIS()">
KIRIM KE VVIS
</button>

<button class="gray" onclick="window.close()">
TUTUP KAMERA
</button>

<div class="footer">
VVIS - VIHARA PUSAT<br>
SISTEM IDENTIFIKASI KENDARAAN
</div>

</div>

<script>
let stream=null;
let fotoTersedia=false;

const camera=document.getElementById("camera");
const photo=document.getElementById("photo");
const canvas=document.getElementById("canvas");
const statusBox=document.getElementById("status");

function status(teks){
  statusBox.textContent=teks;
}

async function startCamera(){
  const btn=document.getElementById("startBtn");
  btn.disabled=true;
  btn.textContent="MEMBUKA KAMERA...";

  try{
    stream=await navigator.mediaDevices.getUserMedia({
      audio:false,
      video:{
        facingMode:{ideal:"environment"},
        width:{ideal:1280},
        height:{ideal:720}
      }
    });

    camera.srcObject=stream;
    await camera.play();

    camera.style.display="block";
    document.getElementById("placeholder").style.display="none";
    document.getElementById("guide").style.display="block";

    btn.style.display="none";
    document.getElementById("captureBtn").style.display="block";

    status("Kamera aktif. Arahkan kotak hijau ke nomor polisi.");
  }catch(e){
    status("Kamera gagal dibuka. Izinkan akses kamera pada Chrome. "+e.message);
    btn.disabled=false;
    btn.textContent="MULAI KAMERA";
  }
}

function capturePhoto(){
  if(!camera.videoWidth){
    status("Kamera belum siap. Tunggu sebentar.");
    return;
  }

  canvas.width=camera.videoWidth;
  canvas.height=camera.videoHeight;

  canvas.getContext("2d").drawImage(
    camera,0,0,canvas.width,canvas.height
  );

  photo.src=canvas.toDataURL("image/jpeg",0.95);
  photo.style.display="block";
  camera.style.display="none";

  stopCamera();

  fotoTersedia=true;

  document.getElementById("guide").style.display="none";
  document.getElementById("captureBtn").style.display="none";
  document.getElementById("retakeBtn").style.display="block";
  document.getElementById("ocrBtn").style.display="block";

  status("Foto berhasil diambil. Tekan BACA NOMOR POLISI.");
}

function retakePhoto(){
  fotoTersedia=false;
  photo.style.display="none";
  document.getElementById("retakeBtn").style.display="none";
  document.getElementById("ocrBtn").style.display="none";
  document.getElementById("startBtn").style.display="block";
  document.getElementById("startBtn").disabled=false;
  document.getElementById("startBtn").textContent="MULAI KAMERA";
  document.getElementById("plate").value="";
  document.getElementById("placeholder").style.display="block";
  status("Silakan ambil foto ulang.");
}

async function readPlate(){
  if(!fotoTersedia)return;

  const btn=document.getElementById("ocrBtn");
  btn.disabled=true;
  btn.textContent="SEDANG MEMBACA...";

  status("Sedang membaca tulisan pada foto. Mohon tunggu...");

  try{
    const hasil=await Tesseract.recognize(
      photo.src,
      "eng",
      {
        logger:m=>{
          if(m.status==="recognizing text"){
            status("Pembacaan nomor polisi: "+
              Math.round(m.progress*100)+"%");
          }
        },
        tessedit_pageseg_mode:7
      }
    );

    const teks=hasil.data.text
      .toUpperCase()
      .replace(/[^A-Z0-9 ]/g," ")
      .replace(/\s+/g," ")
      .trim();

    document.getElementById("plate").value=teks;

    if(teks){
      status("Pembacaan selesai. Periksa hasilnya, lalu koreksi jika perlu.");
    }else{
      status("Tulisan belum terbaca. Silakan foto ulang atau ketik nomor polisi secara manual.");
    }

  }catch(e){
    status("OCR gagal membaca foto. Silakan ketik nomor polisi secara manual.");
  }

  btn.disabled=false;
  btn.textContent="BACA NOMOR POLISI";
}

function sendToVVIS(){
  const plat=document.getElementById("plate").value.trim().toUpperCase();

  if(!plat){
    status("Nomor polisi belum diisi.");
    return;
  }

  if(!window.opener || window.opener.closed){
    status("Aplikasi VVIS utama tidak ditemukan. Buka kamera dari menu VVIS.");
    return;
  }

  window.opener.postMessage({
    type:"VVIS_SCAN_RESULT",
    nomorPolisi:plat
  },"*");

  status("Nomor polisi sudah dikirim ke aplikasi VVIS. Silakan kembali ke halaman utama.");
}

function stopCamera(){
  if(stream){
    stream.getTracks().forEach(track=>track.stop());
    stream=null;
  }
  camera.srcObject=null;
}

window.addEventListener("pagehide",stopCamera);
</script>
</body>
</html>
